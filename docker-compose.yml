version: '3.8'

services:
  github-pr-reviewer:
    build: .
    ports:
      - "8080:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      OLLAMA_API_URL: ${OLLAMA_API_URL}
      OLLAMA_API_TOKEN: ${OLLAMA_API_TOKEN}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    volumes:
      - ./config.properties:/app/config.properties
