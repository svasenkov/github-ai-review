# Test configuration
server.port=0
spring.application.name=github-pr-reviewer-test

# Logging configuration for tests
logging.level.ai.review=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.testcontainers=INFO

# Jackson configuration
spring.jackson.default-property-inclusion=NON_NULL

# GitHub API configuration - will be overridden by WireMock
app.github.base-url=http://localhost:${wiremock.github.port:8089}
app.github.token=test-token
app.github.connect-timeout-seconds=5
app.github.request-timeout-seconds=10

# Ollama API configuration - will be overridden by WireMock
app.ollama.api-url=http://localhost:${wiremock.ollama.port:8090}/api/generate
app.ollama.api-token=test-token
app.ollama.model=test-model
app.ollama.connect-timeout-seconds=5
app.ollama.request-timeout-seconds=10
